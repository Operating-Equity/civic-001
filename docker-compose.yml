version: '3.8'
services:
  # Backend API service
  api:
    build: 
      context: ./civic-backend
      dockerfile: Dockerfile
    container_name: civic-api
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - ./civic-backend/.env
    environment:
      - FLASK_PORT=5002
      - PORT=5002
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    volumes:
      - uploads:/app/uploads  # Changed to only mount the uploads directory
    networks:
      - civic-network
    command: gunicorn --workers=4 --bind=0.0.0.0:5002 "wsgi:application"  # Use Gunicorn instead of dev server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
  # Frontend service
  web:
    build:
      context: ./civic-frontend
      # Pass build arguments to configure the build process
      args:
        - REACT_APP_API_URL=http://api:5002
        - BACKEND_PORT=5002
        - NODE_ENV=production
    container_name: civic-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://api:5002
      - API_PORT=5002
      - BACKEND_PORT=5002
    depends_on:
      - api
    networks:
      - civic-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  civic-network:
    driver: bridge
    
volumes:
  uploads:
    driver: local