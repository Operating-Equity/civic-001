# Explicitly define DNS resolver for Docker
resolver 127.0.0.11 valid=10s ipv6=off;

# Hardcode upstream API server to use port 5002
upstream backend_api {
    # Force port 5002 for API server, no variables or resolution
    server 172.18.0.2:5002;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
      application/javascript
      application/json
      application/x-javascript
      text/css
      text/javascript
      text/plain
      text/xml;
    
    # API proxy - use fixed IP and port to avoid DNS resolution issues
    location /api/ {
        # Set explicit backend address with fixed port 5002
        proxy_pass http://backend_api/api/;
        
        # Error handling for connection issues
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_intercept_errors on;
        
        # Explicitly set HTTP version and headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Set very long timeouts for video processing
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        
        # Increase max body size for video uploads (match Flask's 100MB limit)
        client_max_body_size 100M;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
