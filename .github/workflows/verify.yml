# Runs on every push and every pull request, so the Checks line on a pull request means something.
# Nothing here ever sees the real prompts. It proves four things instead:
#   1. No real prompt file is committed, and the vault still ignores them.
#   2. The leak guard actually detects prompt text in a committed file (it is fed planted text).
#   3. The leak guard finds a tell word in what a reader receives (it is fed a planted word), naming it
#      by its fingerprint alone.
#   4. Requests carry the configured model, the configured effort, the prompt verbatim and web
#      search, and nothing else, using stand-in prompts against the mock API.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civic-web
    # The economics (server/economics.js) are proved on a real Postgres, as on Render: a service
    # container here, and CIVIC_VERIFY_REQUIRE_DATABASE=1 so that a missing database fails the guard
    # rather than skipping its checks.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVIC_VERIFY_DATABASE_URL: postgres://postgres:verify@localhost:5432/postgres
      CIVIC_VERIFY_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-fund --no-audit

      - name: No real prompt file is committed
        run: |
          tracked=$(git ls-files server/prompts | sort | tr '\n' ' ')
          expected="server/prompts/.gitignore server/prompts/README.md server/prompts/evaluate.example.txt server/prompts/extract.example.txt "
          if [ "$tracked" != "$expected" ]; then
            echo "The prompt vault contains a file it must not: $tracked"; exit 1
          fi
          echo "Vault holds only its .gitignore, its README and the two templates."

      - name: The leak guard detects prompt text (planted on purpose)
        run: |
          # Feed the guard a "prompt" made of lines that really are in a committed file. It must fail.
          head -40 README.md > /tmp/planted.txt
          if out=$(CIVIC_PROMPT_EXTRACT_FILE=/tmp/planted.txt node scripts/leak-check.mjs 2>&1); then
            echo "The leak guard did not notice planted prompt text. It is not protecting anything."; exit 1
          fi
          # It names what it found by a fingerprint, never by the text: a report must not carry the prompt on.
          awk 'length($0) >= 40 { print substr($0, 1, 30) }' /tmp/planted.txt > /tmp/planted-pieces.txt
          if printf '%s' "$out" | grep -qF -f /tmp/planted-pieces.txt; then
            echo "The leak guard printed the text it found."; exit 1
          fi
          echo "Guard failed on planted text, as it must, and printed none of it."

      - name: The leak guard finds a tell word in what a reader receives (planted on purpose)
        run: |
          # Words a reader's language file carries, given as a tell word: --served must fail, and name it by its
          # fingerprint alone (server/tells.js).
          if out=$(CIVIC_TELL_WORDS='{"served": ["Extraction output"]}' node scripts/leak-check.mjs --served 2>&1); then
            echo "The leak guard did not notice a planted tell word in what a reader receives."; exit 1
          fi
          if printf '%s' "$out" | grep -qi "extraction output"; then
            echo "The leak guard printed the word it found."; exit 1
          fi
          echo "Guard failed on a planted tell word, as it must, and printed none of it."

      - name: Requests carry the configuration and nothing else (source inside the prompt)
        run: |
          # Stand-in prompts. The real ones are the operator's and are never in CI. This one has a
          # bracketed line, closed by a line after it, so the source is put in its place and the
          # whole is the message.
          mkdir -p /tmp/prompts
          printf 'Stand-in extraction prompt used only by continuous integration.\nReturn a numbered list of the empirical propositions in the text below.\n<text>\n[The text goes here.]\n</text>\n' > /tmp/prompts/extract.txt
          printf 'Stand-in evaluation prompt used only by continuous integration.\nThe statement under inspection is {{CLAIM}} and the reply must end with a conclusion and a confidence percentage.\n' > /tmp/prompts/evaluate.txt
          CIVIC_PROMPT_EXTRACT_FILE=/tmp/prompts/extract.txt \
          CIVIC_PROMPT_EVALUATE_FILE=/tmp/prompts/evaluate.txt \
          npm run verify

      - name: Requests carry the configuration and nothing else (source as a separate message)
        run: |
          # The same, with a prompt that has no bracketed line: it travels as the instructions.
          printf 'Stand-in extraction prompt used only by continuous integration.\nReturn a numbered list of the empirical propositions in the text below.\n' > /tmp/prompts/extract-plain.txt
          CIVIC_PROMPT_EXTRACT_FILE=/tmp/prompts/extract-plain.txt \
          CIVIC_PROMPT_EVALUATE_FILE=/tmp/prompts/evaluate.txt \
          npm run verify
