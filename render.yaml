# Hosting on Render (render.com). Render reads this file from the repository (New → Blueprint) and
# creates the CIVIC web service; a service created through Render's API carries the same settings.
# After the service exists, the two prompts go in as Secret Files named extract.txt and
# evaluate.txt (mounted at /etc/secrets/, never in the repository), and the values marked
# sync: false are set in Render and nowhere else: the operator's OpenAI key, the listing's key on
# Fireworks (5 October; DeepSeek's own, 4 October, if the listing goes there instead), the operator's address and
# the hash of the one-time link that makes the operator's account (civic-web/server/accounts.js), and the database's
# address.
services:
  - type: web
    name: civic
    runtime: node
    plan: starter            # always on; 512 MB, which the upload cap below respects
    region: ohio
    rootDir: civic-web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true         # every merge to main deploys itself; a merge waits until /api/health reports no run in flight
    # The internal ledger and the error log live here, so they outlive a deploy. A service with a disk is
    # stopped before its next version starts, so a deploy is a minute of "cut · going again" on the page.
    disk:
      name: civic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CIVIC_PROMPT_EXTRACT_FILE
        value: /etc/secrets/extract.txt
      - key: CIVIC_PROMPT_EVALUATE_FILE
        value: /etc/secrets/evaluate.txt
      - key: CIVIC_LEDGER_FILE
        value: /var/data/civic-ledger.jsonl
      - key: CIVIC_ERROR_LOG
        value: /var/data/civic-errors.log
      - key: CIVIC_MAX_UPLOAD_BYTES
        value: "67108864"    # 64 MB: an upload is held whole in memory and parsed there; Starter has 512 MB
      - key: CIVIC_ALLOW_PRIVATE_URLS
        value: "false"
      # The operator's keys: set in Render, never here.
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY     # the listing's key when CIVIC_EXTRACT_PROVIDER is fireworks
        sync: false
      - key: DEEPSEEK_API_KEY      # the listing's key when CIVIC_EXTRACT_PROVIDER is deepseek
        sync: false
      - key: CIVIC_EXTRACT_PROVIDER
        value: deepseek            # the operator's choice of 5 October, for speed: DeepSeek's own service. Never Fireworks
                                   # ("Never go back to fireworks", 5 October); the fallback is openai
      - key: CIVIC_EFFORT
        value: xhigh               # OpenAI's two steps, back to the setting before 21 September (5 October)
      - key: CIVIC_REASONING_MODE
        value: standard
      # Accounts (5 October: "Get rid of access codes"): on unless CIVIC_ACCOUNTS is off. The operator's address is
      # reserved for the one-time link whose SHA-256 is CIVIC_OPERATOR_CLAIM, both set in Render; $10 of credit to
      # start, the operator's figure ("assume everyone who signs up gets $10").
      - key: CIVIC_ACCOUNTS
        value: "on"
      - key: CIVIC_OPERATOR_EMAILS
        sync: false
      - key: CIVIC_OPERATOR_CLAIM
        sync: false
      - key: CIVIC_SIGNUP_GRANT_CENTS
        value: "1000"
      # The measurement of every run and determination (server/economics.js), and the accounts, their
      # sessions and their credit (server/accounts.js, server/credit.js), live in the Render Postgres named
      # CIVIC; its internal connection string is set on the service in Render as DATABASE_URL (Render's own
      # name for it), never here. With accounts on and no DATABASE_URL, the service does not start.
      - key: DATABASE_URL
        sync: false
