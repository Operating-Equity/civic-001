# Hosting on Render (render.com). Render reads this file from the repository (New → Blueprint) and
# creates the CIVIC web service; a service created through Render's API carries the same settings.
# After the service exists, the prompts go in as Secret Files named extract.txt, evaluate.txt and
# rank.txt, the second pass's (mounted at /etc/secrets/, never in the repository), and the values marked
# sync: false are set in Render and nowhere else: the operator's OpenAI key, the listing's key on
# Fireworks (5 October; DeepSeek's own, 4 October, if the listing goes there instead), their Google key for the
# trial on Gemini (18 October), the operator's address and
# the hash of the one-time link that makes the operator's account (civic-web/server/accounts.js), and the database's
# address.
services:
  - type: web
    name: civic
    runtime: node
    plan: starter            # always on; 512 MB, which the upload cap below respects
    region: ohio
    rootDir: civic-web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true         # every merge to main deploys itself; a merge waits until /api/health reports no run in flight
    # The internal ledger and the error log live here, so they outlive a deploy. A service with a disk is
    # stopped before its next version starts, so a deploy is a minute of "cut · going again" on the page.
    disk:
      name: civic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CIVIC_PROMPT_EXTRACT_FILE
        value: /etc/secrets/extract.txt
      - key: CIVIC_PROMPT_EVALUATE_FILE
        value: /etc/secrets/evaluate.txt
      - key: CIVIC_PROMPT_RANK_FILE      # the second pass (16 October): optional; without it the claims are listed unranked
        value: /etc/secrets/rank.txt
      - key: CIVIC_RANK                  # one pass (24 October): the listing's own order and roles; `operator` brings the second pass back for the operator's runs
        value: off
      - key: CIVIC_LEDGER_FILE
        value: /var/data/civic-ledger.jsonl
      - key: CIVIC_ERROR_LOG
        value: /var/data/civic-errors.log
      - key: CIVIC_MAX_UPLOAD_BYTES
        value: "67108864"    # 64 MB: an upload is held whole in memory and parsed there; Starter has 512 MB
      - key: CIVIC_ALLOW_PRIVATE_URLS
        value: "false"
      # The operator's keys: set in Render, never here.
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY     # the listing's key when CIVIC_EXTRACT_PROVIDER is fireworks
        sync: false
      - key: DEEPSEEK_API_KEY      # the listing's key when CIVIC_EXTRACT_PROVIDER is deepseek
        sync: false
      - key: GEMINI_API_KEY        # the operator's trial on Gemini 4 Argon (18 October): their own Google key
        sync: false
      - key: CIVIC_TELL_WORDS      # the operator's tell words (20 October, civic-web/server/tells.js): set in Render, never here
        sync: false
      - key: CIVIC_BLOCKED_SITES   # the sites the operator keeps out of the research (25 October, civic-web/server/sites.js): set in Render, never here
        sync: false
      - key: CIVIC_BLOCKED_MORE_FILE   # their second list, a secret file (25 October, civic-web/server/sites.js): set in Render, never here
        sync: false
      - key: CIVIC_BLOCKED_WORDS   # the words a page names itself one of the kinds kept out by (25 October): set in Render, never here
        sync: false
      - key: CIVIC_BLOCKED_MARKUP   # the structured-data types it names itself one by (25 October): set in Render, never here
        sync: false
      - key: CIVIC_EXTRACT_PROVIDER
        value: openai              # the operator's choice of 24 October, after DeepSeek's first listing with the new
                                   # prompt; DeepSeek's own service from 5 to 24 October. Never Fireworks ("Never go back
                                   # to fireworks", 5 October)
      - key: CIVIC_EXTRACT_MODELS
        value: gpt-6.1-sol         # the operator's choice of 24 October: OpenAI's "near-Astra intelligence for a fifth of
                                   # the price"; one id = no fallback
      - key: CIVIC_EXTRACT_EFFORT
        value: medium              # the operator's answer of 24 October (OpenAI's default; "work requiring judgment");
                                   # low on DeepSeek from 18 October
      - key: CIVIC_EXTRACT_REASONING_SUMMARY
        value: "off"               # no running summary on the page while the claims are listed (24 October: "No")
      - key: CIVIC_RANK_EFFORT
        value: low                 # the ranking thinks at low too: the operator's answer of 19 October, after it took
                                   # 69 s at high (68 of them thinking) beside the listing's 55 s at low
      - key: CIVIC_EFFORT
        value: xhigh               # OpenAI's two steps, back to the setting before 21 September (5 October)
      - key: CIVIC_REASONING_MODE
        value: standard
      # Accounts (5 October: "Get rid of access codes"): on unless CIVIC_ACCOUNTS is off. The operator's address is
      # reserved for the one-time link whose SHA-256 is CIVIC_OPERATOR_CLAIM, both set in Render; $10 of credit to
      # start, the operator's figure ("assume everyone who signs up gets $10").
      - key: CIVIC_ACCOUNTS
        value: "on"
      - key: CIVIC_OPERATOR_EMAILS
        sync: false
      - key: CIVIC_OPERATOR_CLAIM
        sync: false
      - key: CIVIC_SIGNUP_GRANT_CENTS
        value: "1000"
      # The measurement of every run and determination (server/economics.js), and the accounts, their
      # sessions and their credit (server/accounts.js, server/credit.js), live in the Render Postgres named
      # CIVIC; its internal connection string is set on the service in Render as DATABASE_URL (Render's own
      # name for it), never here. With accounts on and no DATABASE_URL, the service does not start.
      - key: DATABASE_URL
        sync: false
