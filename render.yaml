# Hosting on Render (render.com). Render reads this file from the repository (New → Blueprint) and
# creates the CIVIC web service; a service created through Render's API carries the same settings.
# After the service exists, the two prompts go in as Secret Files named extract.txt and
# evaluate.txt (mounted at /etc/secrets/, never in the repository), and the two values marked
# sync: false are set in Render and nowhere else: the operator's OpenAI key, and the access codes
# that open the door (civic-web/server/access.js).
services:
  - type: web
    name: civic
    runtime: node
    plan: starter            # always on; 512 MB, which the upload cap below respects
    region: ohio
    rootDir: civic-web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true         # every merge to main deploys itself; a merge waits until /api/health reports no run in flight
    # The one thing that outlives a deploy: the internal ledger, the sign-in log, the error log and
    # the record of runs per code (server/uses.js) live here. A service with a disk is stopped
    # before its next version starts, so a deploy is a minute of "cut · going again" on the page.
    disk:
      name: civic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CIVIC_PROMPT_EXTRACT_FILE
        value: /etc/secrets/extract.txt
      - key: CIVIC_PROMPT_EVALUATE_FILE
        value: /etc/secrets/evaluate.txt
      - key: CIVIC_LEDGER_FILE
        value: /var/data/civic-ledger.jsonl
      - key: CIVIC_SIGNIN_LOG
        value: /var/data/civic-signins.jsonl
      - key: CIVIC_ERROR_LOG
        value: /var/data/civic-errors.log
      - key: CIVIC_USES_FILE
        value: /var/data/civic-uses.jsonl
      - key: CIVIC_CODE_USES
        value: "5"           # runs a code allows unless its entry says otherwise (ABCD234:150), the operator's rule
      - key: CIVIC_MAX_UPLOAD_BYTES
        value: "67108864"    # 64 MB: an upload is held whole in memory and parsed there; Starter has 512 MB
      - key: CIVIC_ALLOW_PRIVATE_URLS
        value: "false"
      # The operator's key and the access codes (a code, or a code with its own allowance after a
      # colon): set in Render, never here.
      - key: OPENAI_API_KEY
        sync: false
      - key: CIVIC_ACCESS_CODES
        sync: false
